<div class="chamber-dashboard">
	<div class="row headline-cards">
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="active_matters">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Active Matters"></div>
				</div>
			</div>
		</div>
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="total_matters">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Total Matters"></div>
				</div>
			</div>
		</div>
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="upcoming_hearings">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Hearings (next 30 days)"></div>
				</div>
			</div>
		</div>
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="court_fees_paid">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Court Fees Paid (INR)"></div>
				</div>
			</div>
		</div>
	</div>
	<div class="row secondary-cards">
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="pending_signatures">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Pending Signatures"></div>
				</div>
			</div>
		</div>
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="caveats_active">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Active Caveats"></div>
				</div>
			</div>
		</div>
		<div class="col-sm-6 col-md-3">
			<div class="card stat-card" data-stat="overdue_deadlines">
				<div class="card-body">
					<h3 class="stat-value">—</h3>
					<div class="stat-label" data-label="Overdue / Flagged Deadlines"></div>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-md-6">
			<div class="card chart-card">
				<div class="card-body">
					<h5 data-label="Matters by Vertical"></h5>
					<div class="chart-container" id="chart-vertical"></div>
				</div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="card chart-card">
				<div class="card-body">
					<h5 data-label="Matters by Status"></h5>
					<div class="chart-container" id="chart-status"></div>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-md-12">
			<div class="card chart-card">
				<div class="card-body">
					<h5 data-label="Hearings in the Next 30 Days"></h5>
					<div class="chart-container" id="chart-hearings"></div>
				</div>
			</div>
		</div>
	</div>
</div>
